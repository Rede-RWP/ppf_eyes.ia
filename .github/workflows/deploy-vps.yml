name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch: # botão "Run workflow" manual no GitHub

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="/opt/ppf-eyes"
            cd "$APP_DIR"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            chmod +x scripts/deploy.sh
            APP_DIR="$APP_DIR" DEPLOY_BRANCH=main ./scripts/deploy.sh
